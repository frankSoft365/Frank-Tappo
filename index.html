<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frank Tappo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="pet" data-pet-drag-region>
      <div id="stage" data-hand="up" data-eyes="open" aria-hidden="true">
        <!-- Frame sources come from the active skin pack (src/skins.ts); the six ids are the socket. -->
        <img id="pet-art" alt="" draggable="false" />
        <img id="pet-art-left" alt="" draggable="false" />
        <img id="pet-art-right" alt="" draggable="false" />
        <img id="pet-art-eyes" alt="" draggable="false" />
        <img id="pet-art-eyes-left" alt="" draggable="false" />
        <img id="pet-art-eyes-right" alt="" draggable="false" />
        <svg id="tap-impact" viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true" focusable="false">
          <g id="tap-impact-left">
            <path d="M6.5 11v6" stroke-width="4.6" />
            <path d="m15.9 11.9 4.2 4.2" stroke-width="4.6" />
            <path d="m24.9 7.9 4.2 4.2" stroke-width="4.6" />
          </g>
          <g id="tap-impact-right">
            <path d="M29.1 11v6" stroke-width="4.6" />
            <path d="m15.5 16.1 4.2-4.2" stroke-width="4.6" />
            <path d="m10.7 7.9-4.2 4.2" stroke-width="4.6" />
          </g>
        </svg>
      </div>

      <div id="pet-controls" data-pet-drag-region>
        <span id="tap-count" aria-label="累计点击: 0" title="累计点击: 0">0</span>
        <button id="settings-toggle" type="button" aria-label="更多" title="更多" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
            <path d="M7.8 7.2h8.4" />
            <path d="M7.8 12h8.4" />
            <path d="M7.8 16.8h8.4" />
          </svg>
        </button>
      </div>

      <div id="banner" hidden>
        <p data-i18n="banner.message">
          需要在「输入监控」中允许 Tappo，才能感知键盘。
        </p>
        <button id="banner-btn" type="button" data-i18n="banner.button">去开启</button>
      </div>

      <div id="badge" data-i18n="badge.clickThrough" hidden>点击穿透</div>

      <span id="dev-mark" aria-hidden="true">DEV</span>
    </main>
  </body>
</html>
